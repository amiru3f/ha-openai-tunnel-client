name: OpenAI Tunnel Client
version: "0.0.15"
slug: openai_tunnel_client
description: Connect a private Home Assistant MCP server to an OpenAI Secure MCP Tunnel.
url: https://github.com/amiru3f/ha-openai-tunnel-client
arch:
  - amd64
startup: services
boot: auto
init: false
options:
  tunnel_id: ""
  control_plane_api_key: ""
  mcp_server_url: ""
  mcp_access_token: ""
  log_level: info
schema:
  tunnel_id: str
  control_plane_api_key: password
  mcp_server_url: str
  mcp_access_token: password
  log_level: list(trace|debug|info|warn|error)
